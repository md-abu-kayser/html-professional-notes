<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar (No JavaScript)</title>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { margin: 0; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .navbar { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; background: #1f2937; color: #fff; }
    .navbar__brand { font-weight: 700; text-decoration: none; color: #fff; }
    .navbar__links { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
    .navbar__links a { color: #fff; text-decoration: none; }
    .navbar__links a:hover, .navbar__links a:focus-visible { text-decoration: underline; }
    .navbar__toggle-label { display: none; }

    @media (max-width: 640px) {
      .navbar__toggle-label {
        display: block; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 0.25rem;
      }
      .navbar__toggle:focus-visible ~ .navbar__toggle-label {
        outline: 2px solid #fff; outline-offset: 2px;
      }
      .navbar__links {
        display: none; flex-direction: column; gap: 1rem;
        position: absolute; top: 100%; left: 0; right: 0;
        background: #1f2937; padding: 1rem 1.5rem;
      }
      .navbar__toggle:checked ~ .navbar__links { display: flex; }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Primary">
    <a class="navbar__brand" href="/">Brand</a>

    <!--
      No-JS disclosure pattern: the checkbox is visually-hidden (not
      display:none), so it stays in the tab order and keyboard-operable via
      Space. Its <label> doubles as the visible toggle button. When
      JavaScript IS available, prefer a real
      <button aria-expanded="false" aria-controls="nav-links"> instead — it's
      announced more clearly by screen readers than a checkbox is.
    -->
    <input type="checkbox" id="nav-toggle" class="navbar__toggle visually-hidden">
    <label for="nav-toggle" class="navbar__toggle-label">
      <span class="visually-hidden">Toggle navigation menu</span>
      <span aria-hidden="true">&#9776;</span>
    </label>

    <ul class="navbar__links" id="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products">Products</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
