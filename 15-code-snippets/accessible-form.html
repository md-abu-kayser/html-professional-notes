<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Form Example</title>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 1.25rem; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; }
    legend { padding: 0 0.4rem; font-weight: 600; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    input, select, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; font: inherit; }
    .hint { font-size: 0.875rem; color: #555; margin-top: 0.25rem; }
    .error { color: #b00020; font-size: 0.875rem; margin-top: 0.25rem; }
    input:invalid { border-color: #b00020; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-row label { display: inline; font-weight: normal; margin: 0; }
    button { padding: 0.75rem; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Create an Account</h1>

  <!--
    novalidate is set here because this file demonstrates the *markup* for a
    custom error-message pattern (role="alert" + aria-describedby). In
    production, pair it with JavaScript that runs on submit, toggles the
    hidden state of #email-error, and calls focus() on the first invalid
    field — native "required"/"minlength" still provide a baseline even if
    that JavaScript fails to load.
  -->
  <form novalidate>
    <fieldset>
      <legend>Account details</legend>

      <div>
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          aria-describedby="email-hint email-error"
        >
        <p id="email-hint" class="hint">We'll never share your email.</p>
        <p id="email-error" class="error" role="alert" hidden>Please enter a valid email address.</p>
      </div>

      <div>
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          aria-describedby="password-hint"
        >
        <p id="password-hint" class="hint">At least 8 characters.</p>
      </div>
    </fieldset>

    <fieldset>
      <legend>Notification preferences</legend>
      <div class="checkbox-row">
        <input type="checkbox" id="newsletter" name="newsletter">
        <label for="newsletter">Send me the newsletter</label>
      </div>
    </fieldset>

    <button type="submit">Create account</button>
  </form>
</body>
</html>
